logger:
  format: text
  level: debug

postgres:
  max_conns: 10
  max_lifetime: 20s

inventory_service:
  host: inventory-service
  port: 50051

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s

kafka:
  brokers: [loyalty-kafka:9092]
  consume_topic: payments
  produce_topic: orders
  id: orders-service
  capacity: 50
  batch_timeout: 500ms
  partition: 0
  batch_size: 50
  attempts: 5
  read_timeout: 5s
  write_timeout: 5s

outbox:
  tick: 250ms
  limit: 50